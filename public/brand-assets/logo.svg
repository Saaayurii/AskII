<?xml version="1.0" encoding="UTF-8"?>
<svg width="2458px" height="512px" viewBox="0 0 2458 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>СпросиИИ Логотип</title>
    <desc>СпросиИИ - AI-powered чат система</desc>
    <g id="Logo" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g id="sprosiI_logo" fill-rule="nonzero">
            <g id="ai-logo">
                <!-- Основной круг с зеленым градиентом -->
                <defs>
                    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <circle id="MainCircle" fill="url(#greenGradient)" cx="256" cy="256" r="256"></circle>

                <!-- AI символ в центре -->
                <g id="ai-symbol" transform="translate(196, 196)">
                    <!-- Нейронная сеть иконка -->
                    <circle cx="30" cy="30" r="8" fill="#FFFFFF" opacity="0.9"/>
                    <circle cx="90" cy="30" r="8" fill="#FFFFFF" opacity="0.9"/>
                    <circle cx="60" cy="90" r="10" fill="#FFFFFF"/>

                    <!-- Соединительные линии -->
                    <line x1="30" y1="30" x2="60" y2="90" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
                    <line x1="90" y1="30" x2="60" y2="90" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
                    <line x1="30" y1="30" x2="90" y2="30" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
                </g>
            </g>

            <!-- Текст "СпросиИИ" -->
            <g id="text" transform="translate(550, 150)">
                <text x="0" y="80" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="96" font-weight="700" fill="#1F2937">
                    <tspan>СпросиИИ</tspan>
                </text>
                <text x="0" y="140" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="36" font-weight="400" fill="#6B7280">
                    <tspan>AI-powered поддержка</tspan>
                </text>
            </g>
        </g>
    </g>
</svg>