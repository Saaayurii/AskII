<!DOCTYPE html>
<html>
<head>
  <title>404 - Страница не найдена | СпросиИИ</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated stars background */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.3), 0 0 40px rgba(34, 197, 94, 0.2);
      }
      50% {
        box-shadow: 0 0 30px rgba(34, 197, 94, 0.5), 0 0 60px rgba(34, 197, 94, 0.3);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @keyframes flap-left {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      50% { transform: rotate(-15deg) scaleY(0.8); }
    }

    @keyframes flap-right {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      50% { transform: rotate(15deg) scaleY(0.8); }
    }

    .bat-container {
      display: inline-block;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(34, 197, 94, 0.4));
    }

    .left-wing {
      transform-origin: 50px 30px;
      animation: flap-left 0.3s ease-in-out infinite;
    }

    .right-wing {
      transform-origin: 50px 30px;
      animation: flap-right 0.3s ease-in-out infinite;
    }

    .container {
      max-width: 600px;
      padding: 2rem;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .error-code {
      font-size: 8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      animation: glow 2s ease-in-out infinite;
      line-height: 1;
    }

    .robot {
      font-size: 6rem;
      margin-bottom: 1.5rem;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(34, 197, 94, 0.4));
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #f1f5f9;
      font-weight: 600;
    }

    p {
      font-size: 1.125rem;
      color: #cbd5e1;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
      color: white;
      text-decoration: none;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(34, 197, 94, 0.5);
    }

    .links {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
    }

    .links a {
      color: #22c55e;
      text-decoration: none;
      margin: 0 1rem;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .links a:hover {
      color: #10b981;
      text-decoration: underline;
    }

    /* Glowing orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.2;
      animation: pulse 4s ease-in-out infinite;
    }

    .orb1 {
      width: 300px;
      height: 300px;
      background: #22c55e;
      top: 10%;
      left: -10%;
      animation-delay: 0s;
    }

    .orb2 {
      width: 250px;
      height: 250px;
      background: #10b981;
      bottom: 10%;
      right: -5%;
      animation-delay: 2s;
    }

    @media (max-width: 640px) {
      .error-code {
        font-size: 5rem;
      }

      .robot {
        font-size: 4rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      p {
        font-size: 1rem;
      }

      .btn {
        padding: 0.875rem 1.5rem;
        font-size: 0.95rem;
      }

      .links a {
        display: block;
        margin: 0.5rem 0;
      }
    }
  </style>
</head>
<body>
  <!-- Animated background stars -->
  <div class="stars" id="stars"></div>

  <!-- Glowing orbs -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <!-- Main content -->
  <div class="container">
    <div class="bat-container">
      <svg viewBox="0 0 100 60" width="120" height="72">
        <path class="left-wing" d="M50 30 Q30 20 10 25 Q20 30 15 40 Q25 35 30 45 Q35 35 40 40 Q42 32 50 30" fill="#1e1b4b"/>
        <path class="right-wing" d="M50 30 Q70 20 90 25 Q80 30 85 40 Q75 35 70 45 Q65 35 60 40 Q58 32 50 30" fill="#1e1b4b"/>
        <ellipse cx="50" cy="35" rx="8" ry="12" fill="#1e1b4b"/>
        <circle cx="50" cy="22" r="8" fill="#1e1b4b"/>
        <path d="M44 16 L42 8 L46 14" fill="#1e1b4b"/>
        <path d="M56 16 L58 8 L54 14" fill="#1e1b4b"/>
        <circle cx="47" cy="21" r="2" fill="#22c55e"/>
        <circle cx="53" cy="21" r="2" fill="#22c55e"/>
      </svg>
    </div>
    <div class="error-code">404</div>
    <h1>Страница потерялась в космосе</h1>
    <p>
      Извините, но страница, которую вы ищете, не существует.
      Возможно, она была перемещена или удалена.
    </p>
    <a href="/" class="btn">← Вернуться на главную</a>

    <div class="links">
      <a href="/">Главная</a>
      <a href="javascript:history.back()">Назад</a>
    </div>
  </div>

  <script>
    // Generate random stars
    const starsContainer = document.getElementById('stars');
    const numStars = 100;

    for (let i = 0; i < numStars; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.animationDuration = (2 + Math.random() * 2) + 's';
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
