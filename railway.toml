[build]
builder = "docker"

[deploy]
healthcheckPath = "/api/v1/accounts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "chatwoot"

[services.source]
repo = "YOUR_USERNAME/chatwoot"
rootDirectory = "/"

[[services.variables]]
name = "SECRET_KEY_BASE"
value = "{{RAILWAY_SECRET_KEY_BASE}}"

[[services.variables]]
name = "FRONTEND_URL"
value = "https://${{RAILWAY_PUBLIC_DOMAIN}}"

[[services.variables]]
name = "RAILS_ENV"
value = "production"

[[services.variables]]
name = "ENABLE_ACCOUNT_SIGNUP"
value = "false"

[[services.variables]]
name = "FORCE_SSL"
value = "true"

[[services.variables]]
name = "POSTGRES_HOST"
value = "${{Postgres.PGHOST}}"

[[services.variables]]
name = "POSTGRES_USERNAME"
value = "${{Postgres.PGUSER}}"

[[services.variables]]
name = "POSTGRES_PASSWORD"
value = "${{Postgres.PGPASSWORD}}"

[[services.variables]]
name = "POSTGRES_DATABASE"
value = "${{Postgres.PGDATABASE}}"

[[services.variables]]
name = "REDIS_URL"
value = "${{Redis.REDIS_URL}}"

[[services.variables]]
name = "PORT"
value = "3000"

# Оптимизация для бесплатного плана
[[services.variables]]
name = "RAILS_MAX_THREADS"
value = "3"

[[services.variables]]
name = "WEB_CONCURRENCY"
value = "1"

[[services.variables]]
name = "SIDEKIQ_CONCURRENCY"
value = "3"